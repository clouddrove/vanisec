apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vanisec.fullname" . }}
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vanisec.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vanisec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vanisec.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.env.NODE_ENV | quote }}
        - name: REDIS_URL
          value: {{ .Values.env.REDIS_URL | quote }}
        {{- /* env.REDIS_PASSWORD wins, so an external Redis can differ from the
               embedded one. Falling back to redis.password matters because that
               value is what puts --requirepass on the embedded server: setting
               it alone used to lock the app out of its own Redis. */}}
        {{- $redisPassword := .Values.env.REDIS_PASSWORD | default .Values.redis.password }}
        {{- if $redisPassword }}
        - name: REDIS_PASSWORD
          value: {{ $redisPassword | quote }}
        {{- end }}
        {{- if .Values.env.NEXT_PUBLIC_BASE_URL }}
        - name: NEXT_PUBLIC_BASE_URL
          value: {{ .Values.env.NEXT_PUBLIC_BASE_URL | quote }}
        {{- end }}
        {{- if .Values.env.NEXT_PUBLIC_GA_ID }}
        - name: NEXT_PUBLIC_GA_ID
          value: {{ .Values.env.NEXT_PUBLIC_GA_ID | quote }}
        {{- end }}
        {{- if .Values.env.GA_ID }}
        - name: GA_ID
          value: {{ .Values.env.GA_ID | quote }}
        {{- end }}
        {{- if .Values.healthcheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthcheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.healthcheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthcheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.healthcheck.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}


