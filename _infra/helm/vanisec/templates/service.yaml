apiVersion: v1
kind: Service
metadata:
  name: {{ include "vanisec.fullname" . }}
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vanisec.selectorLabels" . | nindent 4 }}
    {{- /* Without this the selector also matches the embedded Redis pods, which
           carry the same name and instance labels, and a share of HTTP traffic
           lands on a pod that does not speak HTTP. */}}
    app.kubernetes.io/component: app


