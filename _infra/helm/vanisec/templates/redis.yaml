{{- if .Values.redis.enabled -}}
{{- /* When REDIS_PASSWORD comes from a Secret, the embedded server has to read
       it from the same place. Otherwise it would start with no password while
       the app kept sending AUTH, and every connection would be refused. */ -}}
{{- $secretKeys := include "vanisec.secretEnvKeys" . | fromYaml -}}
{{- $secretName := include "vanisec.secretName" . -}}
{{- $redisPasswordKey := index $secretKeys "REDIS_PASSWORD" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vanisec.fullname" . }}-redis
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vanisec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      {{- /* Rotating the password in the chart-created Secret has to restart the
             server as well as the app, or the two disagree about it. */}}
      {{- if and .Values.secrets.create $redisPasswordKey }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "vanisec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        {{- if $redisPasswordKey }}
        {{- /* Kubernetes expands $(VAR) in command and args from the container's
               own env, so the password reaches redis-server without ever being
               written into the pod spec or into the process arguments. redis-cli
               reads the same value from REDISCLI_AUTH, which is why the probes
               below pass no flag. */}}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: {{ $redisPasswordKey }}
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: {{ $redisPasswordKey }}
        {{- end }}
        command:
        - redis-server
        - --appendonly
        - "yes"
        {{- if $redisPasswordKey }}
        - --requirepass
        - "$(REDIS_PASSWORD)"
        {{- else if .Values.redis.password }}
        - --requirepass
        - {{ .Values.redis.password | quote }}
        {{- end }}
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          {{- toYaml .Values.redis.resources | nindent 12 }}
        livenessProbe:
          exec:
            command:
            - redis-cli
            {{- if and .Values.redis.password (not $redisPasswordKey) }}
            - -a
            - {{ .Values.redis.password | quote }}
            {{- end }}
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            {{- if and .Values.redis.password (not $redisPasswordKey) }}
            - -a
            - {{ .Values.redis.password | quote }}
            {{- end }}
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      {{- if .Values.redis.persistence.enabled }}
      - name: redis-data
        persistentVolumeClaim:
          claimName: {{ include "vanisec.fullname" . }}-redis
      {{- else }}
      - name: redis-data
        emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vanisec.fullname" . }}-redis
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "vanisec.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
{{- if .Values.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vanisec.fullname" . }}-redis
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  {{- if .Values.redis.persistence.storageClass }}
  storageClassName: {{ .Values.redis.persistence.storageClass }}
  {{- end }}
{{- end }}
{{- end }}
