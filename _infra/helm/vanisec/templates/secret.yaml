{{- /* Only rendered for the chart-managed path, and only once there is at least
       one value to put in it. secrets.existingSecret means the Secret already
       exists and is somebody else's to write. */ -}}
{{- $secretKeys := include "vanisec.secretEnvKeys" . | fromYaml -}}
{{- if and .Values.secrets.create $secretKeys -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-env" (include "vanisec.fullname" .) }}
  labels:
    {{- include "vanisec.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
type: Opaque
{{- /* stringData rather than base64 in data. Base64 is an encoding, not a
       protection, and writing it out would suggest the rendered manifest is
       safe to share when it is exactly as readable either way. */}}
stringData:
  {{- range $name, $key := $secretKeys }}
  {{ $key }}: {{ index $.Values.secrets.data $name | quote }}
  {{- end }}
{{- end }}
