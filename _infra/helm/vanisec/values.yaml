# Default values for vanisec
replicaCount: 2

image:
  repository: ghcr.io/clouddrove/vanisec
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: vanisec.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Redis Configuration
# Set enabled: false to use an external Redis instance
redis:
  enabled: true  # Set to false to use external Redis
  image:
    repository: redis
    tag: "7-alpine"
  # Optional: Set password for Redis authentication
  # If set, Redis will require this password for connections
  password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 6379

env:
  NODE_ENV: "production"
  # Redis Connection URL
  # - If redis.enabled: true, use: redis://vanisec-redis:6379/3 (default)
  # - If redis.enabled: false, set to your external Redis URL
  #   Examples:
  #     - redis://external-redis.example.com:6379/3
  #     - redis://:password@external-redis.example.com:6379/3
  #     - redis://redis-service.namespace.svc.cluster.local:6379/3
  REDIS_URL: "redis://vanisec-redis:6379/3"
  # Optional: Redis password (if Redis requires authentication)
  # This will be used if REDIS_URL doesn't include password
  # Only needed if password is not included in REDIS_URL
  REDIS_PASSWORD: ""
  # Base URL for the application (e.g., https://vanisec.clouddrove.com)
  # Protocol (https://) is optional - will be added automatically if missing
  NEXT_PUBLIC_BASE_URL: ""
  # Optional: Google Analytics Measurement ID (e.g., G-XXXXXXXXXX)
  NEXT_PUBLIC_GA_ID: ""
  # Optional: Dashboard access token (required to access /bob analytics)
  # If not set, dashboard will be accessible without authentication (not recommended for production)
  DASHBOARD_TOKEN: ""

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

healthcheck:
  enabled: true
  path: "/"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

