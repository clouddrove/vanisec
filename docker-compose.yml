services:
  redis:
    image: redis:7-alpine
    container_name: ots-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ots-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      x-bake:
        cache-from:
          - type=registry,ref=ghcr.io/clouddrove/tessera:buildcache
        cache-to:
          - type=registry,ref=ghcr.io/clouddrove/tessera:buildcache,mode=max
    container_name: ots-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379/3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ots-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ots-network:
    driver: bridge

volumes:
  redis-data:

