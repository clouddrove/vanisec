services:
  redis:
    image: redis:7-alpine
    container_name: ots-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Optional: Uncomment to enable Redis password authentication
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes
    # Uncomment and set password if you want Redis authentication
    # environment:
    #   - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      # If using password, update healthcheck: redis-cli -a ${REDIS_PASSWORD} ping
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ots-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ots-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # If Redis has password, use: redis://:password@redis:6379/3
      # Or set REDIS_PASSWORD env var separately
      - REDIS_URL=redis://redis:6379/3
      # Optional: Uncomment if Redis requires password authentication
      # - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Google Analytics: set GA_ID for runtime (or NEXT_PUBLIC_GA_ID at build time)
      - GA_ID=${GA_ID:-}
      # - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ots-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ots-network:
    driver: bridge

volumes:
  redis-data:

