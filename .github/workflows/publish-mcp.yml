name: Publish MCP Package

# Releases are tagged v<version>. build-and-push.yml listens to the same tags
# for container images, so one tag releases whatever is ready.
#
# The site and the package carry separate version numbers, so a tag is only a
# package release when it matches mcp/package.json. A site release tagged
# v2.1.0 runs this workflow, finds no match, and stops before publishing
# instead of failing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm attach a provenance attestation, so the registry can show which
      # workflow and commit produced the tarball. Also what npm trusted
      # publishing would use if the NPM_TOKEN secret is ever retired.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: mcp
        run: npm ci

      # Decides whether this tag is a package release at all. The site and the
      # package version independently, so v2.1.0 releasing the site must not
      # try, and fail, to publish the package as 2.1.0.
      - name: Is this tag a package release?
        id: gate
        working-directory: mcp
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "manual run, treating $PKG as the candidate"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" = "$PKG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$TAG is not a release of @clouddrove/vanisec-mcp, which is at $PKG. Nothing to publish."
          fi

      # Refuse to republish an existing version rather than failing halfway
      # through with a registry error. npm versions are immutable.
      - name: Check the version is not already published
        if: steps.gate.outputs.publish == 'true'
        working-directory: mcp
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@clouddrove/vanisec-mcp@$PKG" version >/dev/null 2>&1; then
            echo "::error::@clouddrove/vanisec-mcp@$PKG is already on the registry. Bump the version."
            exit 1
          fi

      - name: Typecheck
        if: steps.gate.outputs.publish == 'true'
        working-directory: mcp
        run: npm run typecheck

      # prepublishOnly runs build and test again, but this repo should not
      # depend on that hook staying correct to know whether the package works.
      - name: Test
        if: steps.gate.outputs.publish == 'true'
        working-directory: mcp
        run: npm test

      - name: Build
        if: steps.gate.outputs.publish == 'true'
        working-directory: mcp
        run: npm run build

      - name: Show what would ship
        if: steps.gate.outputs.publish == 'true'
        working-directory: mcp
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ steps.gate.outputs.publish == 'true' && (github.event_name == 'push' || inputs.dry_run == false) }}
        working-directory: mcp
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
